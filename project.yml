name: SwipeClean
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
# Команда разработчика и bundle id — в Config/Signing.xcconfig (свои значения — в Config/Local.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
targets:
  SwipeClean:
    type: application
    platform: iOS
    sources:
      - SwipeClean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwipeClean
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Нужен доступ к фото, чтобы вы могли разобрать галерею и удалить ненужное."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Нужен доступ к фото, чтобы сохранить сжатые копии и вернуть файлы из секретной папки."
        INFOPLIST_KEY_NSContactsUsageDescription: "Нужен доступ к контактам, чтобы найти дубли и контакты без номера."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Нужен доступ к календарю, чтобы найти и удалить старые события."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID открывает секретную папку без PIN-кода."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        # Только TLS системы (IMAP) и SHA-256 для PIN — освобождено от экспортного контроля,
        # TestFlight не спрашивает про шифрование при каждой загрузке.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  SwipeCleanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SwipeCleanTests
    dependencies:
      - target: SwipeClean
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwipeClean.app/SwipeClean"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SwipeCleanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SwipeCleanUITests
    dependencies:
      - target: SwipeClean
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: SwipeClean
schemes:
  SwipeClean:
    build:
      targets:
        SwipeClean: all
        SwipeCleanTests: [test]
        SwipeCleanUITests: [test]
    test:
      targets:
        - SwipeCleanTests
        - SwipeCleanUITests
